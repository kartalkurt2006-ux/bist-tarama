name: BIST 5DK Tarama Botu

on:
  schedule:
    # Hafta içi her gün Türkiye saati ile 09:00 - 19:00 arası her 5 dakikada bir çalışır (UTC dönüşümlüdür)
    - cron: '0-59/5 6-16 * * 1-5'
  workflow_dispatch: # İSTEDİĞİN ZAMAN MANUEL ÇALIŞTIRABİLMEN İÇİN

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    steps:
      - name: Kodlari Repo'dan Cek
        uses: actions/checkout@v4

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Kutuphaneleri Yukle
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Tarama Scriptini Calistir
        run: python bes_dakikalik_tarama.py
