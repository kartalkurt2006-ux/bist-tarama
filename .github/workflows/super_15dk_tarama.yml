name: süper 15 dk BIST Taraması

on:
  # Manuel tetikleme seçeneği (GitHub Actions sekmesinden "Run workflow" ile çalıştırılabilir)
  workflow_dispatch:
  
  # Otomatik çalışma: Hafta içi her 15 dakikada bir (UTC saat dilimine göre ayarlanmıştır)
  schedule:
    - cron: '*/15 7-15 * * 1-5'

jobs:
  tarama_calistir:
    runs-on: ubuntu-latest

    steps:
      - name: Repoyu Koda Dahil Et
        uses: actions/checkout@v4

      - name: Python Ortamını Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Gerekli Kütüphaneleri Yükle
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance requests pytz

      - name: Süper 15 dk Betiğini Çalıştır
        run: |
          python super_15dk.py
