name: BIST Otomatik Tarama

on:
  schedule:
    # Hafta içi borsa seans saatlerinde (Türkiye saati ile 10:00 - 18:00 arası) her 5 dakikada bir çalışır
    - cron: '*/5 7-15 * * 1-5'
  workflow_dispatch:          # Elle tetiklenebilir

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Kodları Çek
      uses: actions/checkout@v4

    - name: Python Kur
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Gerekli Kütüphaneleri Yükle
      run: |
        python -m pip install --upgrade pip
        pip install --no-cache-dir requests yfinance pandas numpy pytz

    - name: Taramayı Çalıştır
      run: python main.py
