name: BIST Otomatik Tarama

on:
  schedule:
    # Hafta içi borsa saatlerinde (TSİ 10:00 - 18:00 arası) her 15 dakikada bir çalışır
    - cron: '*/15 7-15 * * 1-5'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodları Çek
        uses: actions/checkout@v3

      - name: Python Kur
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Kütüphaneleri Yükle
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas requests
          pip install git+https://github.com/twopirllc/pandas-ta.git

      - name: Taramayı Çalıştır
        run: python main.py

